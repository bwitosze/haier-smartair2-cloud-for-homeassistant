probe_set:
  name: Probe set
  description: Temporary. Send probe writes to one Haier AC. Only the given fields are sent.
  fields:
    mac:
      name: MAC
      description: Device MAC, for example 2C37C510CB46.
      required: true
      selector:
        text:
    vane_v:
      name: Vertical vane
      description: Raw vertical vane byte.
      selector:
        number:
          min: 0
          max: 255
          mode: box
    vane_h:
      name: Horizontal vane
      description: Raw horizontal vane byte.
      selector:
        number:
          min: 0
          max: 255
          mode: box
    display:
      name: Display
      description: Turn the unit display on or off.
      selector:
        boolean:
    heat10:
      name: Heat 10
      description: Turn 10 degree heating on or off.
      selector:
        boolean:
    health:
      name: Health
      description: Turn health mode on or off.
      selector:
        boolean:
    self_clean:
      name: Self clean
      description: Start self clean. False is ignored.
      selector:
        boolean:
